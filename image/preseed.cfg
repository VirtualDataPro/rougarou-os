# Leave language, keyboard, network, accounts, clock and partitioning interactive.
# No disk name, partition recipe, password or destructive confirmation is preset.
# Rougarou's headless package selection is installed from its verified payload.
# The initrd supplies welcome/theme, operator access and optional software choices.
# Do not preseed rougarou/operator-access here: normal installs ask explicitly.
# Normal installs ask before recording agent and container choices.
d-i passwd/root-login boolean false
d-i apt-setup/use_mirror boolean false
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i preseed/late_command string /bin/sh /cdrom/rougarou/install-target.sh
