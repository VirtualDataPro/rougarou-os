# RougarouOS boot menu. Installed only by explicit configure-grub invocation.
# Local values in this file or later /etc/default/grub.d/*.cfg files take priority.
# Debian's native kernel, encrypted-root and recovery generators remain intact.
GRUB_DISTRIBUTOR=RougarouOS
GRUB_TIMEOUT_STYLE="${GRUB_TIMEOUT_STYLE:-menu}"
GRUB_TIMEOUT="${GRUB_TIMEOUT:-5}"
GRUB_TERMINAL_INPUT="${GRUB_TERMINAL_INPUT:-${GRUB_TERMINAL:-console}}"
GRUB_TERMINAL_OUTPUT="${GRUB_TERMINAL_OUTPUT:-${GRUB_TERMINAL:-console}}"

# Console colors approximate the operator's green/black theme using GRUB's
# portable text palette. An existing graphical theme/background is respected.
export ROUGAROU_GRUB_PALETTE="${ROUGAROU_GRUB_PALETTE:-yes}"
