#cloud-config
# Vendor data; Proxmox supplies the operator's public key and DHCP metadata.
package_update: true
package_upgrade: false
packages:
  - nginx
  - qemu-guest-agent
  - rsync
  - ca-certificates
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/nginx/sites-available/default
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          server_name _;
          root /srv/rougarou;
          index index.html;
          autoindex off;
          server_tokens off;
          # Add explicitly reviewed client ranges before exposing this server.
          allow 127.0.0.1;
          deny all;
          location ~ (^|/)\. { deny all; }
          location ~ /(?:pool|by-hash)/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
              try_files $uri =404;
          }
          location / {
              add_header Cache-Control "no-cache";
              try_files $uri $uri/ =404;
          }
      }
  - path: /srv/rougarou/index.html
    permissions: '0644'
    content: |
      <!doctype html><html lang="en"><meta charset="utf-8">
      <title>Rougarou OS packages</title>
      <body style="background:#080f0b;color:#dfe7df;font:18px monospace;max-width:48em;margin:4em auto;padding:1em">
      <h1 style="color:#79c58e">Rougarou OS package repository</h1>
      <p>Self-hosted Rougarou package repository. Release metadata and packages are authenticated by the Rougarou signing key.</p>
      <p>Testing channel: <a style="color:#79c58e" href="/channels/testing/InRelease">signed testing metadata</a>.</p>
      <p>The stable channel remains unpublished until the operator tests and approves a snapshot.</p>
      <p>This server holds public artifacts only. Signing keys remain offline from this server.</p></body></html>
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent.service]
  - [nginx, -t]
  - [systemctl, enable, --now, nginx.service]
  - [systemctl, reload, nginx.service]
